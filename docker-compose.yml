services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oiltrade
      POSTGRES_PASSWORD: oiltrade_local_only
      POSTGRES_DB: oiltrade
    ports:
      - "5432:5432"
    volumes:
      - oiltrade_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oiltrade -d oiltrade"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  oiltrade_postgres:
